services:
  - type: web
    name: borhan-sk-cloud
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /tmp/borhan-sk-data
      - key: REQUIRE_SUPABASE
        value: "true"
      - key: OWNER_USERNAME
        value: owner
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: PROFILE_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_WEB_URL
        value: https://web.telegram.org/k/
      - key: MIN_JOB_INTERVAL_SECONDS
        value: "60"
      - key: MAX_ACTIVE_JOBS_PER_ACCOUNT
        value: "20"
      - key: MAX_TOTAL_JOBS_PER_ACCOUNT
        value: "200"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "240"
      - key: KEEPALIVE_TIMEOUT_SECONDS
        value: "20"
      - key: SESSION_SAVE_INTERVAL_SECONDS
        value: "60"
      - key: SUPABASE_HEARTBEAT_INTERVAL_SECONDS
        value: "240"
      - key: WAKE_WAIT_SECONDS
        value: "55"
      - key: COOKIE_SECURE
        value: "true"
      - key: LOGIN_MAX_ATTEMPTS
        value: "7"
      - key: LOGIN_LOCK_SECONDS
        value: "900"
