services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      TELEGRAM_DATA_DIR: /data/telegram
      TELEGRAM_UPLOAD_DIR: /data/uploads
      APP_LOG_DIR: /data/logs
      VNC_TOKEN_FILE: /data/vnc_tokens.txt
      PORT: "8000"
    volumes:
      - ./data:/data
    expose:
      - "8000"
      - "6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
