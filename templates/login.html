<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورود | Meow Studio Cloud</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#29245a,transparent 40%),radial-gradient(circle at 90% 90%,#143c48,transparent 35%),#090b16;color:#edf0ff;font-family:Tahoma,Arial,sans-serif}.card{width:min(420px,92vw);padding:34px;border:1px solid #ffffff1c;border-radius:26px;background:#111629dc;box-shadow:0 28px 80px #0008;backdrop-filter:blur(18px)}.logo{width:62px;height:62px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(135deg,#8975ff,#42d7c1);font-size:30px;box-shadow:0 12px 34px #7464ef66}h1{font-size:24px;margin:22px 0 8px}.muted{color:#929bb9;line-height:1.9;font-size:13px}label{display:block;margin:24px 0 9px;color:#cbd2e8;font-size:13px}input{width:100%;padding:15px 16px;border-radius:13px;background:#080d1c;border:1px solid #2c3554;color:#fff;outline:none;font-size:15px}input:focus{border-color:#9a88ff;box-shadow:0 0 0 3px #8e7aff20}button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:13px;background:linear-gradient(100deg,#8172f7,#37bea9);color:#fff;font-weight:bold;font-size:15px;cursor:pointer}.error{margin-top:14px;padding:11px;border-radius:10px;background:#5b2333;color:#ffc4d2;font-size:13px}.foot{margin-top:22px;color:#66708f;font-size:11px;text-align:center}
  </style>
</head>
<body><main class="card"><div class="logo">✦</div><h1>Meow Studio Cloud</h1><div class="muted">پنل خصوصی مدیریت اتوماسیون تلگرام<br>برای ورود، رمز مدیریتی تنظیم‌شده در Render را وارد کن.</div><form method="post"><label for="password">رمز عبور مدیریت</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button type="submit">ورود امن به پنل</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="foot">Private control center · Session protected</div></main></body></html>
