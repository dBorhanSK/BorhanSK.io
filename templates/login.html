<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07162f">
  <title>ورود | Borhan_SK</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="{{ url_for('static', filename='borhan-mark.svg') }}" alt="Borhan SK">
      <div class="wordmark"><span>Borhan_</span><b>SK</b></div>
    </div>
    <div class="login-kicker">PRIVATE AUTOMATION PLATFORM</div>
    <h1>ورود به پنل</h1>
    <p class="muted">برای ورود، نام کاربری و رمز اختصاصی خودت را وارد کن.</p>
    <form method="post" class="login-form" autocomplete="on">
      <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
      <label for="username">نام کاربری</label>
      <input id="username" name="username" type="text" maxlength="32" autocomplete="username" required autofocus>
      <label for="password">رمز عبور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary-btn">ورود امن <span>←</span></button>
    </form>
    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
    <div class="login-foot">BORHAN_SK · SECURE CONTROL</div>
  </main>
</body>
</html>
