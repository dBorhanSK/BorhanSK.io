[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/data/logs

[program:backend]
command=/opt/venv/bin/gunicorn --chdir /app/backend --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 120 --graceful-timeout 20 --keep-alive 30 app:app
directory=/app/backend
user=borhan
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/data/logs/backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=HOME="/home/borhan",PYTHONUNBUFFERED="1"

[program:websockify]
command=/usr/bin/websockify --heartbeat 30 --web /usr/share/novnc --token-plugin TokenFile --token-source /data/vnc_tokens.txt 6080
user=borhan
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/data/logs/websockify.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
environment=HOME="/home/borhan"
